<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anna Sokolova</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--paper:#EFEFEC;--red:#C8101C;--ink:#121212;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",Arial,sans-serif;font-weight:300;
  min-height:100vh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding-top:clamp(40px,8vw,96px);display:grid;align-content:start;gap:18px}
h1{margin:0;font:500 clamp(96px,26vw,300px)/.84 "Golos Text",Arial,sans-serif;letter-spacing:-.05em;color:var(--red)}
p{margin:0;font:500 clamp(14px,1.6vw,18px)/1.4 "Golos Text",Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--red)}
a{width:fit-content;font:500 13px/1 "Golos Text",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:10px 14px;margin-top:10px}
a:hover{background:var(--ink);color:var(--paper)}
svg.m{display:block;width:calc(100% + 32px);margin:0 -16px;height:clamp(180px,30vw,360px);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="horn" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 112 V70 C60 56 54 48 44 42 C30 34 14 40 15 55 C16 68 33 70 36 58 C38 50 31 46 27 51"/>
      <path d="M60 70 C60 56 66 48 76 42 C90 34 106 40 105 55 C104 68 87 70 84 58 C82 50 89 46 93 51"/>
      <path d="M60 112 C60 98 50 92 42 94 C34 96 34 106 41 107"/>
      <path d="M60 112 C60 98 70 92 78 94 C86 96 86 106 79 107"/>
      <path d="M60 14 L69 26 L60 38 L51 26 Z"/>
    </g>
    <pattern id="knit" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#2A5E26"/>
      <ellipse cx="2.8" cy="6" rx="2.2" ry="5.3" transform="rotate(-26 2.8 6)" fill="#448239"/>
      <ellipse cx="7.2" cy="6" rx="2.2" ry="5.3" transform="rotate(26 7.2 6)" fill="#4F9142"/>
      <ellipse cx="2.4" cy="4.6" rx=".8" ry="2.4" transform="rotate(-26 2.4 4.6)" fill="#66A855" opacity=".7"/>
      <ellipse cx="7.6" cy="4.6" rx=".8" ry="2.4" transform="rotate(26 7.6 4.6)" fill="#70B15E" opacity=".7"/>
    </pattern>
    <pattern id="knitS" width="6" height="7" patternUnits="userSpaceOnUse">
      <rect width="6" height="7" fill="#1E4A1C"/>
      <ellipse cx="1.7" cy="3.5" rx="1.3" ry="3.1" transform="rotate(-26 1.7 3.5)" fill="#356F2E"/>
      <ellipse cx="4.3" cy="3.5" rx="1.3" ry="3.1" transform="rotate(26 4.3 3.5)" fill="#417F37"/>
    </pattern>
    <linearGradient id="farFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D8DF"/><stop offset="1" stop-color="#DCE5E6"/>
    </linearGradient>
    <linearGradient id="midFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9CA4"/><stop offset=".55" stop-color="#3E7783"/><stop offset="1" stop-color="#2D6874"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFEFEC" stop-opacity="0"/><stop offset="1" stop-color="#EFEFEC" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="shadeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="crownShade" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>
    <g id="apple"><circle r="3.8" fill="#C8101C"/><circle cx="-1.2" cy="-1.3" r="1.1" fill="#fff" opacity=".55"/><path d="M0 -3.6 q1.5 -2.4 3.4 -2.6" stroke="#2B2114" stroke-width=".9" fill="none"/></g>
    <g id="treeBody">
      <rect x="-3.2" y="-24" width="6.4" height="27" rx="2" fill="#2B2114"/>
      <circle cx="0" cy="-44" r="25" fill="url(#knitS)"/>
      <circle cx="0" cy="-44" r="25" fill="url(#crownShade)"/>
    </g>
    <g id="mtnBase">
      <path d="M0 210 L90 150 L160 175 L260 95 L340 140 L420 110 L520 60 L600 120 L680 90 L760 130 L860 70 L960 125 L1040 100 L1120 140 L1200 115 V330 H0 Z" fill="url(#farFill)"/>
      <path d="M520 60 L498 79 L510 76 L519 85 L530 75 L542 80 Z M860 70 L840 86 L851 84 L860 92 L870 83 L880 87 Z M260 95 L241 109 L251 107 L260 114 L269 106 L278 110 Z" fill="#F7F7F5"/>
      <path d="M0 250 L120 175 L200 205 L310 120 L380 160 L470 95 L560 170 L650 135 L720 165 L820 100 L900 150 L990 120 L1080 175 L1200 150 V330 H0 Z" fill="url(#midFill)"/>
      <path d="M310 120 L290 140 L300 137 L310 146 L320 136 L330 140 Z M470 95 L446 117 L458 114 L468 124 L478 113 L490 120 Z M820 100 L795 122 L808 119 L818 128 L830 118 L845 124 Z" fill="#F7F7F5"/>
      <rect x="0" y="180" width="1200" height="110" fill="url(#haze)"/>
      <path d="M0 290 C200 245 380 260 560 285 S900 300 1200 262 V330 H0 Z" fill="url(#knit)"/>
      <path d="M0 290 C200 245 380 260 560 285 S900 300 1200 262 V330 H0 Z" fill="url(#shadeFront)"/>
    </g>
  </defs>
</svg>
<main>
  <h1>404</h1>
  <p>This apple rolled away. Эта страница укатилась.</p>
  <a href="/">Back to the main page / На главную</a>
</main>

</body>
</html>
